<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doof WebGL Wasm Sky Map</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body, .app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #02030a; }
      .app { position: relative; }
      .sky { display: block; width: 100%; height: 100%; cursor: grab; outline: none; }
      .sky:active { cursor: grabbing; }
      .status {
        position: absolute; left: 1rem; bottom: 1rem; margin: 0; padding: .65rem .85rem;
        border: 1px solid rgb(255 255 255 / .16); border-radius: .65rem;
        background: rgb(2 3 10 / .72); color: rgb(235 242 255 / .9);
        font-size: .82rem; letter-spacing: .01em; backdrop-filter: blur(10px);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <p id="status" class="status">Drag to look · Hold Space to fly · std/game Wasm backend</p>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
